[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypdb2pov"
version = "0.1.0"
description = "Convert PDB and PDBx/mmCIF atomic structures into POV-Ray scenes"
readme = "README.md"
requires-python = ">=3.12, <3.14"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eric G. Suchanek, Ph.D." }]
keywords = ["pdb", "mmcif", "povray", "molecular graphics", "raytracing"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
# Deliberately none: the point of a stand-alone directory is that it runs
# wherever there is a Python, with no wheels to build and nothing to pin.
dependencies = []

# The maintainer toolchain. A Poetry group and not an extra: an extra is
# written into wheel metadata, so `pip install pypdb2pov[dev]` would offer
# every consumer this repo's `ruff<0.16` cap -- on a package whose whole claim
# is that it has no dependencies at all. Installed with
# `poetry install --with dev`, which is what CI runs.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pre-commit = ">=4.5.1"
pytest = ">=7"
ruff = ">=0.4.0,<0.16"
ty = ">=0.0.41"

# Maintainer knowledge-graph tooling, not a dependency of this package.
# `.mcp.json` serves `pycodekg` and `dockg` MCP servers from `.venv/bin/`, so
# the CLIs have to be in this repo's environment -- but nothing under src/
# imports either one, and declaring them as real dependencies would put them in
# the published wheel for every consumer of a package whose whole point is that
# it has none.
#
# A Poetry group is the right shape: it is locked and installable but never
# written into wheel metadata, so `pip install pypdb2pov` is unaffected.
#
#   poetry install --with kg      # gets the CLIs into .venv/bin
#   poetry install                # default -- the group is optional, skipped
#
# `kg` is the fleet-wide name for this group so there is one command to
# remember; contents are per-repo and minimal.
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
pycode-kg = ">=0.23.0"
doc-kg = ">=0.21.2"

[project.scripts]
pypdb2pov = "pypdb2pov.cli:main"

[project.urls]
Homepage = "https://github.com/Flux-Frontiers/pypdb2pov"
Repository = "https://github.com/Flux-Frontiers/pypdb2pov"
Issues = "https://github.com/Flux-Frontiers/pypdb2pov/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypdb2pov = ["include/*.inc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
# The floor the package claims, not whichever interpreter happens to run the
# lint -- otherwise UP rewrites suggest syntax the floor cannot parse.
target-version = "py312"
# ruff 0.16 formats Python code blocks inside Markdown as stable behaviour, so
# `ruff format --check .` would start rewriting prose docs. Doc snippets are
# illustrative and often deliberately aligned; keep them out of the formatter's
# reach. The rest of the fleet carries the same exclusion.
extend-exclude = [".claude", ".agents", ".codex", "*.md"]

[tool.ruff.lint]
# B023, BLE001, PLC0415 replace the retired pylint hook's cell-var-from-loop,
# broad-exception-caught, and import-outside-toplevel checks.
select = ["E", "F", "W", "I", "UP", "B023", "BLE001", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test imports are often deliberately lazy -- they run after a fixture or a
# skip guard has decided whether the import is even possible.
"tests/**" = ["PLC0415"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"
